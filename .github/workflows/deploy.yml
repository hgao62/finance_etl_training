name: Deploy to Google Cloud

on:
  push:
    branches:
      - main  # Trigger on pushes to main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        service_account_key: ${{ secrets.GCLOUD_SERVICE_KEY }}
        project_id: ${{ secrets.PROJECT_ID }}

    - name: Authenticate Docker with Google Cloud
      run: |
        gcloud auth configure-docker

    - name: Build and Push Docker Image
      run: |
        IMAGE_NAME="gcr.io/${{ secrets.PROJECT_ID }}/airflow-etl:$(date +%Y%m%d%H%M%S)"
        docker build -t "$IMAGE_NAME" .
        docker push "$IMAGE_NAME"

    - name: Deploy to GKE
      run: |
        gcloud container clusters get-credentials ${{ secrets.CLUSTER_NAME }} --region ${{ secrets.REGION }}
        kubectl set image deployment/airflow-deployment airflow-container="$IMAGE_NAME"

    - name: Deploy to Compute Engine (optional)
      run: |
        INSTANCE_NAME="airflow-instance"
        gcloud compute instances update-container "$INSTANCE_NAME" \
          --container-image="$IMAGE_NAME"
