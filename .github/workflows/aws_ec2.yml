name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up SSH agent
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      # Step 3: Deploy to EC2
      - name: Deploy to AWS EC2
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}  # Public IP or domain of your EC2 instance
          SSH_USER: ${{ secrets.EC2_SSH_USER }}  # User for SSH (e.g., ubuntu for Ubuntu instances)
        run: |
          ssh -o StrictHostKeyChecking=no $SSH_USER@$AWS_HOST << 'EOF'
            cd /path/to/your/project  # Replace with the path to your project on the EC2 instance
            git pull origin main
            docker-compose down  # Stop any existing containers
            docker-compose up --build -d  # Build and start containers in detached mode
          EOF
